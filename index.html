<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <button
      type="button"
      id="themeToggle"
      class="theme-toggle"
      aria-label="Switch to dark theme"
      title="Toggle theme"
    >
      <span class="theme-toggle-icon" aria-hidden="true">
        <svg class="icon-moon" viewBox="0 0 24 24">
          <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </span>
      <span id="themeToggleLabel">Dark</span>
    </button>

    <main class="app" data-view="home">
      <header class="brand">
        <div class="brand-title">
          <svg
            class="brand-logo"
            viewBox="0 0 64 64"
            fill="none"
            aria-hidden="true"
          >
            <rect
              x="5"
              y="5"
              width="54"
              height="54"
              rx="3"
              stroke="currentColor"
              stroke-width="4"
            />
            <g transform="translate(32 32) rotate(45)" fill="currentColor">
              <rect x="-15" y="-16" width="28" height="9" rx="1.5" />
              <path d="M13-16l7 4.5-7 4.5z" />
              <rect x="-3.25" y="-8" width="6.5" height="27" rx="1.75" />
            </g>
          </svg>
          <p class="brand-mark">QR Forge</p>
        </div>
        <p id="brandSub" class="brand-sub">Choose a forge to begin.</p>
      </header>

      <section id="homeView" class="home-view" aria-label="Choose a generator">
        <div class="forge-grid">
          <button type="button" class="forge-card" id="openUrlForge">
            <span class="forge-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M10 13a5 5 0 0 1 7.07 0l1.41 1.41a5 5 0 0 1-7.07 7.07l-.71-.71" />
                <path d="M14 11a5 5 0 0 1-7.07 0L5.52 9.59a5 5 0 0 1 7.07-7.07l.71.71" />
              </svg>
            </span>
            <span class="forge-card-copy">
              <span class="forge-card-title">URL Forge</span>
              <span class="forge-card-hint">Build links with optional encryption and shortening</span>
            </span>
          </button>

          <button type="button" class="forge-card" id="openWifiForge">
            <span class="forge-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 12.5a14 14 0 0 1 14 0" />
                <path d="M8.5 16a9 9 0 0 1 7 0" />
                <path d="M12 20h.01" />
                <path d="M2 8.5a20 20 0 0 1 20 0" />
              </svg>
            </span>
            <span class="forge-card-copy">
              <span class="forge-card-title">WiFi QR</span>
              <span class="forge-card-hint">Generate a scannable code to join a wireless network</span>
            </span>
          </button>
        </div>
      </section>

      <div id="urlView" class="forge-view" hidden>
        <div class="forge-nav">
          <button type="button" class="btn-back" id="urlBack">← Home</button>
          <h2 class="forge-heading">URL Forge</h2>
        </div>

        <div class="workspace">
          <section class="composer" aria-label="URL composer">
            <label class="field">
              <span class="field-label">Base URL</span>
              <input
                id="baseUrl"
                type="url"
                placeholder="https://example.com/path"
                autocomplete="off"
                spellcheck="false"
              />
            </label>

            <div class="encrypt-block params-block">
              <label class="toggle">
                <input type="checkbox" id="paramsToggle" />
                <span class="toggle-ui" aria-hidden="true"></span>
                <span class="toggle-copy">
                  <span class="toggle-title">URL parameters</span>
                  <span class="toggle-hint">Optional query string key/value pairs</span>
                </span>
              </label>

              <div id="paramsFields" class="toggle-fields" hidden>
                <div class="params-head">
                  <button type="button" id="addParam" class="btn-ghost">+ Add field</button>
                </div>
                <div class="param-columns">
                  <span class="field-label">Name</span>
                  <span class="field-label">Value</span>
                  <span class="param-columns-spacer"></span>
                </div>
                <div id="paramList" class="param-list"></div>
              </div>
            </div>

            <div class="encrypt-block">
              <label class="toggle">
                <input type="checkbox" id="encryptToggle" />
                <span class="toggle-ui" aria-hidden="true"></span>
                <span class="toggle-copy">
                  <span class="toggle-title">Encrypt parameters</span>
                  <span class="toggle-hint">Pack all fields into a single <code>code=</code> value</span>
                </span>
              </label>

              <div id="secretField" class="toggle-fields" hidden>
                <label class="field">
                  <span class="field-label">Encryption secret</span>
                  <input
                    id="encryptSecret"
                    type="text"
                    placeholder="Shared secret used to encrypt"
                    autocomplete="off"
                    spellcheck="false"
                  />
                </label>
              </div>
            </div>

            <div class="encrypt-block">
              <label class="toggle">
                <input type="checkbox" id="shortenToggle" />
                <span class="toggle-ui" aria-hidden="true"></span>
                <span class="toggle-copy">
                  <span class="toggle-title">Shorten URL</span>
                  <span class="toggle-hint"
                    >Requires your shortener API. Click Generate to create the short link for the QR.</span
                  >
                </span>
              </label>

              <div id="shortenerFields" class="toggle-fields" hidden>
                <label class="field">
                  <span class="field-label">Shortener endpoint</span>
                  <input
                    id="shortenerEndpoint"
                    type="url"
                    placeholder="https://api.example.com/shorten"
                    autocomplete="off"
                    spellcheck="false"
                  />
                </label>
                <label class="field">
                  <span class="field-label">API key (optional)</span>
                  <input
                    id="shortenerApiKey"
                    type="password"
                    placeholder="Bearer / x-api-key value"
                    autocomplete="off"
                    spellcheck="false"
                  />
                </label>
              </div>
            </div>

            <div class="url-preview" aria-live="polite">
              <span class="field-label">Resulting URL</span>
              <code id="urlPreview" class="url-text">Enter a base URL to begin</code>
            </div>

            <div class="composer-actions">
              <button type="button" id="generate" class="btn-primary">Generate</button>
              <div class="workspace-actions">
                <button type="button" id="saveWorkspace" class="btn-ghost">Save workspace</button>
                <button type="button" id="openWorkspace" class="btn-ghost">Open workspace</button>
              </div>
            </div>
          </section>

          <section class="output" id="output" data-state="empty" aria-label="QR code preview">
            <div class="qr-placeholder" id="qrPlaceholder">
              <p class="qr-placeholder-title">QR preview</p>
              <p class="qr-placeholder-text">Enter parameters and click Generate</p>
            </div>

            <div class="qr-result" id="qrResult" hidden>
              <div class="qr-frame">
                <img id="qrImage" alt="Generated QR code" width="280" height="280" />
              </div>
              <p id="qrCaption" class="qr-caption"></p>
              <button type="button" id="savePng" class="btn-secondary">Save as PNG</button>
            </div>
          </section>
        </div>
      </div>

      <div id="wifiView" class="forge-view" hidden>
        <div class="forge-nav">
          <button type="button" class="btn-back" id="wifiBack">← Home</button>
          <h2 class="forge-heading">WiFi QR</h2>
        </div>

        <div class="workspace">
          <section class="composer" aria-label="WiFi composer">
            <label class="field">
              <span class="field-label">Network name (SSID)</span>
              <input
                id="wifiSsid"
                type="text"
                placeholder="MyNetwork"
                autocomplete="off"
                spellcheck="false"
              />
            </label>

            <label class="field">
              <span class="field-label">Security</span>
              <select id="wifiSecurity">
                <option value="WPA">WPA / WPA2 / WPA3</option>
                <option value="WEP">WEP</option>
                <option value="nopass">None (open network)</option>
              </select>
            </label>

            <label class="field" id="wifiPasswordField">
              <span class="field-label">Password</span>
              <input
                id="wifiPassword"
                type="password"
                placeholder="Network password"
                autocomplete="off"
                spellcheck="false"
              />
            </label>

            <label class="checkbox-field">
              <input type="checkbox" id="wifiHidden" />
              <span>Hidden network</span>
            </label>

            <div class="url-preview" aria-live="polite">
              <span class="field-label">QR payload preview</span>
              <code id="wifiPreview" class="url-text">Enter a network name to begin</code>
            </div>

            <div class="composer-actions">
              <button type="button" id="wifiGenerate" class="btn-primary" disabled>Generate</button>
            </div>
          </section>

          <section class="output" id="wifiOutput" data-state="empty" aria-label="WiFi QR preview">
            <div class="qr-placeholder" id="wifiQrPlaceholder">
              <p class="qr-placeholder-title">QR preview</p>
              <p class="qr-placeholder-text">Enter network details and click Generate</p>
            </div>

            <div class="qr-result" id="wifiQrResult" hidden>
              <div class="qr-frame">
                <img id="wifiQrImage" alt="Generated WiFi QR code" width="280" height="280" />
              </div>
              <p id="wifiQrCaption" class="qr-caption"></p>
              <button type="button" id="wifiSavePng" class="btn-secondary">Save as PNG</button>
            </div>
          </section>
        </div>
      </div>

      <p id="status" class="status" role="status"></p>
    </main>

    <script>
      (function () {
        var theme = 'light';
        try {
          theme = localStorage.getItem('qr-forge-theme') || 'light';
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') theme = 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script src="renderer.js"></script>
  </body>
</html>
